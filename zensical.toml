# ----------------------------------------------------------------------------
# 3. THEME
#
# Controls the visual appearance and interactive behavior of the site.
# ----------------------------------------------------------------------------

[project.theme]
language   = "en"
custom_dir = "./docs/website/overrides"   # folder for template overrides

# Uncomment to switch to the traditional Material for MkDocs look:
#variant = "classic"

# Uncomment to set a custom favicon (path relative to docs_dir):
#favicon = "images/favicon.png"

# Uncomment to use a custom logo image (path relative to docs_dir):
#logo = "assets/logo.png"

# Uncomment to use a built-in Lucide icon as the logo instead:
#[project.theme.icon]
#logo = "lucide/smile"

# ── Feature toggles ───────────────────────────────────────────────────────────
# NOTE: features must live here, directly under [project.theme], before any
# [project.theme.*] sub-tables open — otherwise TOML assigns it to the wrong table.
# Each string enables a specific UI behaviour; uncomment a line to enable it.

features = [

  # Header
  "announce.dismiss",            # let users dismiss the announcement bar
  #"header.autohide",            # hide header when scrolling down

  # Content / code blocks
  "content.code.annotate",       # icon+tooltip annotations inside code blocks
  "content.code.copy",           # copy-to-clipboard button on code blocks
  "content.code.select",         # line-range selection button on code blocks
  "content.footnote.tooltips",   # render footnotes as inline popovers
  "content.tabs.link",           # sync all same-titled content tabs across pages
  "content.tooltips",            # hover tooltips on links

  # Navigation
  "navigation.footer",           # previous/next page links in the footer
  "navigation.indexes",          # attach overview pages directly to sections
  "navigation.instant",          # SPA-style navigation (no full page reload)
  "navigation.instant.prefetch", # prefetch pages on link hover
  "navigation.path",             # breadcrumb trail above each page title
  "navigation.sections",         # group top-level sections in the sidebar
  "navigation.tabs",             # render top-level nav as tabs below the header
  "navigation.top",              # back-to-top button
  "navigation.tracking",         # update URL hash as you scroll through anchors
  #"navigation.expand",          # expand all sidebar sections by default
  #"navigation.prune",           # strip invisible nav items from HTML (saves ~33%)
  #"navigation.tabs.sticky",     # keep tabs visible while scrolling
  #"navigation.instant.progress", # loading progress bar for slow connections

  # Search
  "search.highlight",            # highlight search terms after clicking a result

  # Table of contents
  #"toc.follow",                 # auto-scroll TOC sidebar to the active anchor
  #"toc.integrate",              # merge TOC into the left navigation sidebar

  # Repository (requires repo_url to be set above)
  #"content.action.edit",        # show an "Edit this page" button
  #"content.action.view",        # show a "View source" button
]

# ── Social links (footer) ─────────────────────────────────────────────────────
# Uncomment and repeat for each social/external link to show icons in the footer.
#[[project.extra.social]]
#icon = "fontawesome/brands/github"
#link = "https://github.com/NOAA-GFDL/NDSL"


# ── Fonts ─────────────────────────────────────────────────────────────────────
# Loaded from Google Fonts. "text" for body copy, "code" for code blocks.

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"


# ── Color scheme ──────────────────────────────────────────────────────────────
# Use scheme = "default" for light mode, "slate" for dark mode.

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"


# ----------------------------------------------------------------------------
# 4. MARKDOWN EXTENSIONS
#
# Controls how Markdown is parsed and rendered. Extensions come from
# Python-Markdown and PyMdown Extensions (pymdownx.*).
#
# Read more: https://zensical.org/docs/setup/extensions/
# ----------------------------------------------------------------------------

# ── Standard Python-Markdown ──────────────────────────────────────────────────
[project.markdown_extensions.abbr]        # abbreviation tooltips
[project.markdown_extensions.admonition]  # note/warning/tip callout boxes
[project.markdown_extensions.attr_list]   # add HTML attributes to elements
[project.markdown_extensions.def_list]    # definition lists
[project.markdown_extensions.footnotes]   # [^1] style footnotes
[project.markdown_extensions.md_in_html]  # Markdown inside raw HTML blocks

[project.markdown_extensions.toc]
permalink = true   # add anchor links to every heading


# ── PyMdown extensions ────────────────────────────────────────────────────────
[project.markdown_extensions.pymdownx.arithmatex]
generic = true     # render LaTeX math via MathJax

[project.markdown_extensions.pymdownx.betterem]     # smarter em/strong parsing
[project.markdown_extensions.pymdownx.caret]        # superscript (^text^)
[project.markdown_extensions.pymdownx.details]      # collapsible <details> blocks
[project.markdown_extensions.pymdownx.inlinehilite] # inline `code` syntax highlighting
[project.markdown_extensions.pymdownx.keys]         # keyboard key rendering (++ctrl+c++)
[project.markdown_extensions.pymdownx.magiclink]    # auto-linkify URLs and GitHub refs
[project.markdown_extensions.pymdownx.mark]         # ==highlighted text==
[project.markdown_extensions.pymdownx.smartsymbols] # (c) → © and similar
[project.markdown_extensions.pymdownx.tilde]        # subscript (~text~) and strikethrough

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index     = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums     = true       # add anchor links to line numbers
line_spans          = "__span"   # wrap each line in a <span> for styling
pygments_lang_class = true       # add language class to code blocks

[project.markdown_extensions.pymdownx.superfences]
# Allows non-fenced code blocks and enables Mermaid diagram rendering.
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style     = true   # use the newer tab style
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true   # render [ ] / [x] as styled checkboxes


# ----------------------------------------------------------------------------
# 5. PLUGINS — mkdocstrings
#
# Generates API reference pages automatically from Python docstrings.
# Points at the ndsl/ source directory and expects Google-style docstrings.
#
# Read more: https://mkdocstrings.github.io/
# ----------------------------------------------------------------------------

[project.plugins.mkdocstrings.handlers.python]
paths       = ["ndsl"]
inventories = ["https://docs.python.org/3/objects.inv"]  # cross-ref stdlib docs

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style   = "google"
inherited_members = true    # include methods inherited from parent classes
show_source       = false   # hide raw source code in the rendered docs