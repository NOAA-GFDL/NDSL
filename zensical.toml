# ============================================================================
# zensical.toml — NDSL Documentation Site Configuration
#
# Sections in this file:
# 1. Site Identity       — name, URL, author, copyright
# 2. Assets & Navigation — JS/CSS assets and nav structure
# 3. Theme               — fonts, colors, layout features
# 4. Markdown Extensions — rendering capabilities
# 5. Plugins             — mkdocstrings (auto API docs)
# ============================================================================

