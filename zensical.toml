# ============================================================================
# zensical.toml — NDSL Documentation Site Configuration
#
# Sections in this file:
#   1. Site Identity       — name, URL, author, copyright
#   2. Assets & Navigation — JS/CSS assets and nav structure
#   3. Theme               — fonts, colors, layout features
#   4. Markdown Extensions — rendering capabilities
#   5. Plugins             — mkdocstrings (auto API docs)
# ============================================================================


# ----------------------------------------------------------------------------
# 1. SITE IDENTITY
# Basic metadata used in the HTML head, browser title bar, and page footer.
# ----------------------------------------------------------------------------

[project]
repo_url    = "https://github.com/NOAA-GFDL/NDSL"
repo_name   = "NDSL"
site_name   = "NDSL"
site_author = "Software Modernization Team"
site_url    = "https://www.ndsl_documentation.com/"
copyright   = "&copy; 2026"
docs_dir    = "docs/website"

# Uncomment to add a site description for search engines:
#site_description = "NDSL — NOAA Dominance Stencil Library documentation."


# ----------------------------------------------------------------------------
# 2. ASSETS & NAVIGATION
#
# extra_css / extra_javascript: additional files loaded on every page.
# Paths are relative to docs_dir unless they are full URLs.
#
# nav: defines the top-level tabs and nested sidebar structure. Each entry maps
# a visible label to either a single .md file or a list of sub-entries. Labels
# use inline SVG icons powered by the Lucide library loaded below.
# If nav is removed entirely, Zensical will auto-generate it from your docs
# folder structure. Read more: https://zensical.org/docs/setup/navigation/
# ----------------------------------------------------------------------------

# Lucide icon library — required for the SVG icons used in nav labels.
extra_javascript = [
  "https://unpkg.com/lucide@latest",
  "javasctipt/lucide-init.js",
  "javascripts/extra.js",
]

extra_css        = ["stylesheets/extra.css"]

